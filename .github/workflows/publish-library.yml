name: Publish figure library

on:
  push:
    branches: [main]
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted, category_changed, locked, unlocked]
  discussion_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

concurrency:
  group: notebook-library-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
      discussions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify staged bytes, membership and local links
        run: python tools/prepare_pages.py --check site --portable
      - name: Test public feedback rules
        run: python -m unittest discover -s tools -p test_discussion_review.py
      - name: Refresh shared review from public Discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/discussion_review.py --site site
      - name: Verify the complete review artifact
        run: python tools/prepare_pages.py --check site --portable
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated snapshot
        id: deployment
        uses: actions/deploy-pages@v4
